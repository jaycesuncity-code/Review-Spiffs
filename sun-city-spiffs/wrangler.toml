# Sun City Review Spiffs: one Worker serves the API (/api/*) and the React build (./dist).
name = "review-spiffs"
main = "worker/index.ts"
compatibility_date = "2026-11-01"

# The Worker checks the Cloudflare Access JWT on EVERY request (assets included),
# so a URL without Access in front of it only ever returns 401.
# Option A (no custom domain): keep workers_dev = true and turn on Cloudflare Access
#   for workers.dev in the dashboard (Worker > Settings > Domains & Routes).
# Option B (custom domain): add a route below, put an Access app on it, then set workers_dev = false.
workers_dev = true
preview_urls = false

# routes = [{ pattern = "spiffs.example.com", custom_domain = true }]

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "review-spiffs"
database_id = "cb35f97b-4d83-428a-9f17-4d8e0ae88056"
migrations_dir = "migrations"

[vars]
ENVIRONMENT = "production"
# Your Zero Trust team domain, e.g. "https://suncity.cloudflareaccess.com"
CF_ACCESS_TEAM_DOMAIN = ""
# The Access application's AUD tag. Comma-separate if more than one Access app points here
# (for example workers.dev and a custom domain).
CF_ACCESS_AUD = ""

[observability]
enabled = true
